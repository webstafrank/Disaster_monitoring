# Single door into the on-prem stack. TLS terminates here; everything else binds
# to the internal Docker network only. Replace the cert paths and server_name for
# your internal domain / CA.

events { worker_connections 1024; }

http {
  sendfile on;
  server_tokens off;

  # HTTP -> HTTPS
  server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    server_name asal.internal;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # HTTP basic auth over the whole site. The browser prompts once and reuses the
    # credential for every request to this origin (including WMS tiles under
    # /geoserver/). Generate the file with scripts/set_password.sh; it is mounted
    # read-only and never committed. Individual locations below opt out where needed.
    auth_basic "KSA Rangeland Intelligence Hub";
    auth_basic_user_file /etc/nginx/auth/.htpasswd;

    # Liveness/readiness probes stay unauthenticated so deploy.sh, container
    # healthchecks, and external monitoring can reach them. They expose no data.
    location = /api/health {
      auth_basic off;
      proxy_pass http://api:8000/health;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /api/ready {
      auth_basic off;
      proxy_pass http://api:8000/ready;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend API
    location /api/ {
      proxy_pass http://api:8000/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # GeoServer admin surfaces must never be public. The browser only needs the
    # OGC data endpoints (wms/wfs/ows); the web console and REST config APIs stay
    # on the internal network. Regex location is matched before the prefix below.
    location ~ ^/geoserver/(web|rest|gwc/rest|j_spring_security_check|config) {
      return 403;
    }

    # GeoServer WMS/WFS map layers (OGC data endpoints only)
    location /geoserver/ {
      proxy_pass http://geoserver:8080/geoserver/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Next.js frontend
    location / {
      proxy_pass http://frontend:3000/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }
  }
}
