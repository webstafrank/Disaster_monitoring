# On-prem stack for the KSA Rangeland Intelligence Hub.
# One physical server, isolated services, one door in (Nginx on 443).
#   docker compose --env-file .env up -d --build
#
# The narrative service (llm) needs the authenticated `claude` CLI. Either run it
# on the host (see services/llm/README.md) or mount the host's Claude config into
# the container as shown below.

services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-asal}
      POSTGRES_USER: ${POSTGRES_USER:-asal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/postgresql/data
      # Applied once, on first init of an empty data volume. Idempotent
      # (CREATE TABLE IF NOT EXISTS) so DATA_SOURCE=postgis has its table on boot.
      - ./services/api/sql/observations.sql:/docker-entrypoint-initdb.d/10-observations.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-asal} -d ${POSTGRES_DB:-asal}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [internal]

  geoserver:
    image: docker.osgeo.org/geoserver:2.25.2
    restart: unless-stopped
    environment:
      GEOSERVER_ADMIN_USER: ${GEOSERVER_USER:-admin}
      GEOSERVER_ADMIN_PASSWORD: ${GEOSERVER_PASSWORD:?set GEOSERVER_PASSWORD in .env}
    volumes:
      - geoserver_data:/opt/geoserver_data
      - ${RASTER_DIR:-./data/rasters}:/opt/rasters:ro
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]

  api:
    build: ./services/api
    restart: unless-stopped
    environment:
      DATA_SOURCE: ${DATA_SOURCE:-stub}
      LLM_URL: http://llm:8100
      FORECAST_URL: http://forecast:8200
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      # Real numeric feed (DATA_SOURCE=postgis): read straight from the db service.
      PG_DSN: postgresql://${POSTGRES_USER:-asal}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-asal}
      # Server-side base for WMS layer discovery. Defaults to the bundled geoserver
      # service; override in .env to point at an external GeoServer.
      GEOSERVER_URL: ${GEOSERVER_URL:-http://geoserver:8080/geoserver}
      # Browser-facing WMS base the map tiles from. Set this to a publicly reachable
      # URL when GEOSERVER_URL is internal. Defaults to GEOSERVER_URL if unset.
      GEOSERVER_PUBLIC_URL: ${GEOSERVER_PUBLIC_URL:-}
      GEOSERVER_WORKSPACE: ${GEOSERVER_WORKSPACE:-}
      GEOSERVER_USER: ${GEOSERVER_USER:-admin}
      GEOSERVER_PASSWORD: ${GEOSERVER_PASSWORD:-}
    volumes:
      - ./contracts:/contracts:ro
    depends_on:
      db:
        condition: service_healthy
      llm:
        condition: service_healthy
      forecast:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks: [internal]

  forecast:
    build: ./services/forecast
    restart: unless-stopped
    environment:
      FORECAST_ARTIFACTS: /app/artifacts
    volumes:
      - forecast_artifacts:/app/artifacts
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8200/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks: [internal]

  llm:
    build: ./services/llm
    restart: unless-stopped
    environment:
      LLM_MODE: ${LLM_MODE:-stub}
    # For LLM_MODE=claude in a container, mount authenticated Claude config:
    # volumes:
    #   - ${CLAUDE_CONFIG_DIR:-/home/svc/.claude}:/root/.claude:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8100/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks: [internal]

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE: /api
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [internal]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    depends_on:
      frontend:
        condition: service_healthy
      api:
        condition: service_healthy
      geoserver:
        condition: service_started
    networks: [internal]

volumes:
  db_data:
  geoserver_data:
  forecast_artifacts:

networks:
  internal:
    driver: bridge
