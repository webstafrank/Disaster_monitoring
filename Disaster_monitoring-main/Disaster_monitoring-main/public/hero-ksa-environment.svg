  <path d="M0 880C184 786 380 806 576 884C750 954 916 988 1106 954C1260 926 1434 830 1600 834V1200H0Z" fill="url(#valley)"/>
  <path d="M184 728C314 676 462 698 594 758C710 810 842 850 978 830C1120 810 1260 738 1408 730" fill="none" stroke="#ece4ff" stroke-opacity="0.52" stroke-width="5"/>
  <path d="M160 842C340 784 496 820 656 896C804 964 1000 988 1188 928C1306 890 1404 826 1494 796" fill="none" stroke="#dbeafe" stroke-opacity="0.5" stroke-width="4"/>
