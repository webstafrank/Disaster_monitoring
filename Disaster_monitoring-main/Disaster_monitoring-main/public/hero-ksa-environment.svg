  <path d="M824 724C786 782 752 840 720 900" fill="none" stroke="#355a41" stroke-width="8" stroke-linecap="round"/>
  <path d="M900 748C920 810 946 860 980 920" fill="none" stroke="#355a41" stroke-width="8" stroke-linecap="round"/>
  <path d="M770 826L1212 918" fill="none" stroke="#d5e4ca" stroke-width="20" stroke-linecap="round" opacity="0.45"/>
  <rect width="1600" height="1200" filter="url(#grain)" opacity="0.6"/>
