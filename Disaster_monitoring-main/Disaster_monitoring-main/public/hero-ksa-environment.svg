<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc">
  <title id="title">Environmental monitoring placeholder landscape</title>
  <desc id="desc">A stylized aerial landscape used as a temporary hero image for land use, vegetation, and drought monitoring.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f3f7ff"/>
      <stop offset="100%" stop-color="#ece4ff"/>
    </linearGradient>
    <linearGradient id="mesa" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#174ea6"/>
      <stop offset="100%" stop-color="#071b4d"/>
    </linearGradient>
    <linearGradient id="valley" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8aa86d"/>
      <stop offset="100%" stop-color="#425f42"/>
    </linearGradient>
    <linearGradient id="ridge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6d3bbf"/>
      <stop offset="100%" stop-color="#452082"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.06"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <rect width="1600" height="1200" fill="url(#sky)"/>
  <ellipse cx="1180" cy="230" rx="120" ry="120" fill="#dbeafe" opacity="0.85"/>
